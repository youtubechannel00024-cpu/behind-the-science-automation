name: Behind The Science - 24/7 Autonomous Publisher

on:
  schedule:
    # Runs every 6 hours (02:00, 08:00, 14:00, 20:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger with 1-click in GitHub Actions tab

permissions:
  contents: write

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy edge-tts faster-whisper requests

      - name: Run Autonomous Production Pipeline
        env:
          ZAPIER_WEBHOOK_URL: ${{ secrets.ZAPIER_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python pipeline.py --auto

      - name: Commit and Push Updated History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add published_history.json automation.log || true
          git commit -m "chore: Update published history and metrics [skip ci]" || echo "No changes to commit"
          git push origin main || true
