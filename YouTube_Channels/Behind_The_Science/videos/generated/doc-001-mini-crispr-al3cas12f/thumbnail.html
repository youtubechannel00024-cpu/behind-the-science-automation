<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Inter'; font-weight: 900; src: url('fonts/Inter-Black.otf') format('opentype'); }
html, body { margin: 0; padding: 0; background: #040914; }
canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080"></canvas>
<script>
window.renderThumb = async () => {
  await document.fonts.load('900 180px Inter');
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = 1920, H = 1080;

  const img = new Image();
  img.src = 'assets/thumbnail_bg.jpg';
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });

  // Draw crisp 16:9 molecular artwork slightly shifted slightly right to make room for left bold title
  ctx.drawImage(img, 0, 0, W, H);

  // Cinematic contrast gradient on left side (keeps right DNA, enzyme & nucleus crystal bright)
  const gradL = ctx.createLinearGradient(0, 0, W * 0.62, 0);
  gradL.addColorStop(0, 'rgba(3, 8, 20, 0.90)');
  gradL.addColorStop(0.52, 'rgba(3, 8, 20, 0.62)');
  gradL.addColorStop(1, 'rgba(3, 8, 20, 0.0)');
  ctx.fillStyle = gradL;
  ctx.fillRect(0, 0, W, H);

  // Subtle top/bottom vignette for cinema framing
  const gradV = ctx.createLinearGradient(0, 0, 0, H);
  gradV.addColorStop(0, 'rgba(2, 6, 16, 0.45)');
  gradV.addColorStop(0.2, 'rgba(2, 6, 16, 0)');
  gradV.addColorStop(0.82, 'rgba(2, 6, 16, 0)');
  gradV.addColorStop(1, 'rgba(2, 6, 16, 0.55)');
  ctx.fillStyle = gradV;
  ctx.fillRect(0, 0, W, H);

  // Subtle scientific target reticle highlight around the mini-CRISPR docking site (~1060, 415)
  ctx.save();
  ctx.translate(1075, 415);
  ctx.strokeStyle = 'rgba(250, 204, 21, 0.65)';
  ctx.lineWidth = 3;
  ctx.setLineDash([16, 12]);
  ctx.beginPath(); ctx.arc(0, 0, 155, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);
  // Precision pointer line from left label region
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.75)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-140, -68); ctx.lineTo(-270, -145); ctx.lineTo(-420, -145); ctx.stroke();
  ctx.fillStyle = '#38BDF8';
  ctx.beginPath(); ctx.arc(-140, -68, 7, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // Micro badge above left callout
  ctx.save();
  ctx.font = '800 32px Inter';
  ctx.letterSpacing = '3px';
  const bText = 'MINI CRISPR  ·  Al3Cas12f';
  const bw = ctx.measureText(bText).width + 64;
  ctx.beginPath(); ctx.roundRect(110, 260, bw, 68, 34);
  ctx.fillStyle = 'rgba(8, 22, 48, 0.88)'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#38BDF8'; ctx.stroke();
  ctx.fillStyle = '#38BDF8';
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillText(bText, 142, 296);
  ctx.restore();

  // Main giant impactful headline: "DNA REPAIR?"
  ctx.save();
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
  ctx.shadowBlur = 32;
  ctx.shadowOffsetY = 10;

  ctx.font = '900 205px Inter';
  ctx.letterSpacing = '-4px';
  // Word 1: "DNA"
  ctx.lineWidth = 14; ctx.strokeStyle = '#040914';
  ctx.strokeText('DNA', 105, 535);
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText('DNA', 105, 535);

  // Word 2: "REPAIR?" with warm gold-amber gradient
  const tg = ctx.createLinearGradient(105, 560, 105, 755);
  tg.addColorStop(0, '#FDE047');
  tg.addColorStop(0.55, '#F59E0B');
  tg.addColorStop(1, '#FB923C');
  ctx.lineWidth = 14; ctx.strokeStyle = '#040914';
  ctx.strokeText('REPAIR?', 105, 735);
  ctx.fillStyle = tg;
  ctx.fillText('REPAIR?', 105, 735);
  ctx.restore();

  // Subtle bottom credential strip
  ctx.save();
  ctx.font = '800 30px Inter';
  ctx.letterSpacing = '2px';
  ctx.fillStyle = 'rgba(226, 232, 240, 0.88)';
  ctx.fillText('THE 1/3-SIZE GENE EDITOR RESEARCH', 112, 815);
  ctx.restore();

  // Small crisp Documentary Channel Pill at bottom-right away from YouTube timestamp badge
  ctx.save();
  ctx.font = '800 26px Inter';
  ctx.letterSpacing = '2.5px';
  ctx.fillStyle = 'rgba(56, 189, 248, 0.9)';
  ctx.textAlign = 'left';
  ctx.fillText('BEHIND THE SCIENCE  |  SCIENCE DOCUMENTARY', 112, 980);
  ctx.restore();

  return true;
};
</script>
</body>
</html>
